<svg xmlns="http://www.w3.org/2000/svg" width="840" height="204" viewBox="0 0 840 204" role="img" aria-labelledby="title desc">
<title id="title">Shared language intelligence for agents</title><desc id="desc">The bridge CLI connects to a persistent local core that manages rust-analyzer and the workspace TypeScript server. An optional Zed companion forwards unsaved buffers.</desc>
