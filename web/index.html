<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="/logo.svg"><script>try{const t=localStorage.getItem("bridge-theme");document.documentElement.dataset.theme=t==="light"||t==="dark"?t:matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch{}</script><title>Editor bridge</title>
<style>
:root{color-scheme:light;--bg:#fafafa;--fg:#242424;--surface:#fff;--input:#f4f4f4;--border:#dedede;--muted:#686868;--accent:#282828;--on-accent:#fff;--badge:#eeeeee;--badge-fg:#363636;--error:#ac392d;font:15px/1.5 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg)}:root[data-theme=dark]{color-scheme:dark;--bg:#141414;--fg:#eeeeee;--surface:#1c1c1c;--input:#222;--border:#363636;--muted:#aaa;--accent:#eeeeee;--on-accent:#181818;--badge:#303030;--badge-fg:#ddd;--error:#f1a89e}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:64px auto;padding:0 28px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:44px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}h1{font-size:32px;font-weight:550;letter-spacing:-1px;margin:8px 0}p{color:var(--muted);margin:6px 0}.connection{font-size:12px;border:1px solid var(--border);border-radius:24px;padding:8px 14px;color:var(--badge-fg)}.connection:before{content:'●';color:var(--accent);margin-right:8px}form{display:flex;gap:10px;margin:24px 0 30px}input{flex:1;min-width:0;background:var(--input);border:1px solid var(--border);border-radius:8px;color:inherit;padding:13px;font:inherit}button{border:0;border-radius:8px;background:var(--accent);color:var(--on-accent);padding:12px 20px;font:600 13px system-ui;cursor:pointer}button:disabled{opacity:.5;cursor:wait}article{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:18px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.path{font:13px ui-monospace,monospace;overflow-wrap:anywhere;color:var(--muted)}h2{font-size:19px;font-weight:550;margin:0 0 5px}.badge{font-size:11px;background:var(--badge);color:var(--badge-fg);border-radius:5px;padding:5px 9px;white-space:nowrap}.muted{background:var(--input);color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:24px 0}.label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}.value{margin-top:6px;font-size:14px}details{border-top:1px solid var(--border);padding-top:14px;margin-top:14px}summary{cursor:pointer;font-size:13px;color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace;color:var(--muted);max-height:320px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}td,th{text-align:left;border-bottom:1px solid var(--border);padding:10px 0;overflow-wrap:anywhere}th{color:var(--muted);font-weight:400}.empty{border:1px dashed var(--border);border-radius:12px;text-align:center;padding:70px 24px}.empty h2{margin:10px}.error{color:var(--error);white-space:pre-wrap}footer{margin-top:36px;display:flex;justify-content:space-between;color:var(--muted);font-size:12px}code{font-family:ui-monospace,monospace}a{color:var(--accent)}@media(max-width:650px){main{margin-top:28px;padding:0 18px}header{align-items:start;gap:10px}.stats{grid-template-columns:1fr}.row{align-items:start}footer{display:block}form{flex-direction:column}}
.brand{display:flex;align-items:center;gap:14px}.brand img{border-radius:12px}.header-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}select{background:var(--surface);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:9px;font:inherit;font-size:12px}button[data-operation=workspace_disconnect]{background:transparent;color:var(--muted);border:1px solid var(--border)}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.connection[data-offline=true]:before{color:var(--error)}@media(max-width:650px){header{flex-direction:column}.row{flex-wrap:wrap}.brand img{width:40px;height:40px}}
.language-icon{vertical-align:middle;margin-right:5px}:root[data-theme=dark] .rust-icon{filter:invert(1)}</style></head><body><main><header><div class="brand"><svg class="bridge-mark" viewBox="0 0 64 64" width="44" height="44" aria-hidden="true"><path d="M21 10H9v44h12m22-44h12v44H43M9 32h46" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg><div><div class="eyebrow">Local development</div><h1>Editor bridge</h1><p>Rust and TypeScript intelligence, shared with your agents.</p></div></div><div class="header-controls"><select id="theme" aria-label="Color theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select><span class="connection" id="connection">Connecting</span></div></header>
<form id="attach"><input id="workspace" aria-label="Workspace directory" placeholder="/absolute/path/to/workspace" required><button id="add">Connect workspace</button></form><p id="error" class="error" role="alert"></p><section id="workspaces"></section><section id="disconnected"></section><footer><span>One core · Shared language servers · Optional Zed companion</span><code id="endpoint"></code></footer></main>
<script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let last='';let busy=false;
$('endpoint').textContent=location.origin;
const media=matchMedia('(prefers-color-scheme: dark)');
try{const saved=localStorage.getItem('bridge-theme');$('theme').value=['light','dark'].includes(saved)?saved:'system';}catch{}
function applyTheme(){const theme=$('theme').value;document.documentElement.dataset.theme=theme==='system'?(media.matches?'dark':'light'):theme;}
$('theme').onchange=()=>{try{localStorage.setItem('bridge-theme',$('theme').value);}catch{}applyTheme();};media.addEventListener('change',applyTheme);applyTheme();
function languageIcon(language){return language==='rust'?'<img class="language-icon rust-icon" src="/rust.svg" alt="" width="20" height="20">':'<img class="language-icon" src="/typescript.svg" alt="" width="20" height="20">';}
async function refresh(){if(busy)return;try{const r=await fetch('/api/status');if(!r.ok)throw Error('Core unavailable');const data=await r.json();$('connection').textContent='Core connected';$('connection').dataset.offline='false';const key=JSON.stringify(data);if(key===last)return;last=key;
$('workspaces').innerHTML=data.workspaces.length?data.workspaces.map(w=>`<article><div class="row"><div><h2>${esc(w.workspace.split('/').pop())}</h2><div class="path">${esc(w.workspace)}</div></div><div class="row"><button data-operation="workspace_disconnect" data-workspace="${esc(w.workspace)}">Disconnect</button><span class="badge ${w.ready?'':'muted'}">${w.ready?'Analyzer ready':esc(w.status)}</span></div></div><div class="stats"><div><div class="label">Editor connection</div><div class="value">${w.companion?'Zed · Connected':'Standalone · Disk files'}</div></div><div><div class="label">Saved-file check</div><div class="value">${w.check.running?'Checking…':w.checkFresh?(w.check.success?'Passed':'Errors found'):'Not checked for current changes'}</div></div><div><div class="label">Analyzer process</div><div class="value">${(w.analyzers||[{language:"rust",pid:w.analyzerPid}]).map(a=>`${languageIcon(a.language)} ${esc(a.language === "rust" ? "Rust" : "TypeScript")} · PID ${esc(a.pid??"—")}`).join("<br>")}</div></div></div>${w.check.error?`<p class="error">${esc(w.check.error)}</p>`:''}${w.watcherError?`<p class="error">${esc(w.watcherError)}</p>`:''}<details><summary>Document state · ${w.documents.length} files</summary><table><thead><tr><th>File</th><th>Source</th><th>Version</th></tr></thead><tbody>${w.documents.map(d=>`<tr><td>${esc(decodeURI(d.uri).replace('file://'+w.workspace+'/',''))}</td><td>${esc(d.source)}</td><td>${d.version}</td></tr>`).join('')}</tbody></table></details><details><summary>Compiler diagnostics · ${w.check.diagnostics.length}</summary><p>Saved files only. Request a check through the diagnostics agent tool.</p><pre>${esc(w.check.diagnostics.map(d=>d.rendered||d.message).join('\n')||'No compiler diagnostics cached. Check status above before interpreting this as clean.')}</pre></details><details><summary>Workspace configuration</summary><pre>${esc(JSON.stringify(w.config,null,2))}</pre></details></article>`).join(''):`<div class="empty"><div class="eyebrow">Ready when you are</div><h2>Connect your first workspace</h2><p>Choose a directory containing Cargo.toml, tsconfig.json or package.json.<br>Agents and the Zed companion can also connect workspaces automatically.</p></div>`;$('disconnected').innerHTML=(data.disconnectedWorkspaces||[]).length?'<h2>Disconnected workspaces</h2><p>Analyzers are stopped. Reconnect explicitly to resume.</p>'+data.disconnectedWorkspaces.map(path=>`<article><div class="row"><div class="path">${esc(path)}</div><button data-operation="workspace_connect" data-workspace="${esc(path)}">Reconnect</button></div></article>`).join(''):'';}catch(e){$('connection').textContent='Core disconnected';$('connection').dataset.offline='true';}}
$('attach').onsubmit=async e=>{e.preventDefault();$('add').disabled=true;$('error').textContent='';try{const r=await fetch('/api/workspaces',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({workspace:$('workspace').value})});const v=await r.json();if(!r.ok)throw Error(v.error);$('workspace').value='';await refresh();}catch(e){$('error').textContent=e.message;}finally{$('add').disabled=false;}};
document.querySelector('main').addEventListener('click',async e=>{const button=e.target.closest('button[data-operation]');if(!button||busy)return;busy=true;button.disabled=true;$('error').textContent='';try{const r=await fetch('/api/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({operation:button.dataset.operation,arguments:{workspace:button.dataset.workspace}})});const v=await r.json();if(!r.ok)throw Error(v.error?.message||'Workspace operation failed');last='';}catch(e){$('error').textContent=e.message;}finally{busy=false;button.disabled=false;await refresh();}});
refresh();setInterval(refresh,2000);
</script></body></html>
