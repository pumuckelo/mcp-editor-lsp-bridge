<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor bridge</title>
<style>
:root{color-scheme:dark;font:15px/1.5 system-ui,-apple-system,sans-serif;background:#101512;color:#e5ede7}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:64px auto;padding:0 28px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:44px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#97b09f}h1{font-size:32px;font-weight:550;letter-spacing:-1px;margin:8px 0}p{color:#9cac9f;margin:6px 0}.connection{font-size:12px;border:1px solid #304737;border-radius:24px;padding:8px 14px;color:#b7ddbd}.connection:before{content:'●';color:#8bd09a;margin-right:8px}form{display:flex;gap:10px;margin:24px 0 30px}input{flex:1;min-width:0;background:#19211b;border:1px solid #344238;border-radius:8px;color:inherit;padding:13px;font:inherit}button{border:0;border-radius:8px;background:#bce2a9;color:#162413;padding:12px 20px;font:600 13px system-ui;cursor:pointer}button:disabled{opacity:.5;cursor:wait}article{background:#18201b;border:1px solid #2c3b31;border-radius:12px;padding:24px;margin-bottom:18px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.path{font:13px ui-monospace,monospace;overflow-wrap:anywhere;color:#adbeb0}h2{font-size:19px;font-weight:550;margin:0 0 5px}.badge{font-size:11px;background:#253c2b;color:#c8e6bf;border-radius:5px;padding:5px 9px;white-space:nowrap}.muted{background:#30372f;color:#c3c8bd}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:24px 0}.label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#8fa392}.value{margin-top:6px;font-size:14px}details{border-top:1px solid #304035;padding-top:14px;margin-top:14px}summary{cursor:pointer;font-size:13px;color:#afc7b6}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace;color:#b9c9bf;max-height:320px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}td,th{text-align:left;border-bottom:1px solid #2a382e;padding:10px 0;overflow-wrap:anywhere}th{color:#8fa392;font-weight:400}.empty{border:1px dashed #344438;border-radius:12px;text-align:center;padding:70px 24px}.empty h2{margin:10px}.error{color:#f2b7a0;white-space:pre-wrap}footer{margin-top:36px;display:flex;justify-content:space-between;color:#7f9687;font-size:12px}code{font-family:ui-monospace,monospace}a{color:#bce2a9}@media(max-width:650px){main{margin-top:28px;padding:0 18px}header{align-items:start;gap:10px}.stats{grid-template-columns:1fr}.row{align-items:start}footer{display:block}form{flex-direction:column}}
</style></head><body><main><header><div><div class="eyebrow">Local development</div><h1>Editor bridge</h1><p>Rust and TypeScript intelligence, shared with your agents.</p></div><span class="connection" id="connection">Connecting</span></header>
<form id="attach"><input id="workspace" aria-label="Workspace directory" placeholder="/absolute/path/to/workspace" required><button id="add">Connect workspace</button></form><p id="error" class="error" role="alert"></p><section id="workspaces"></section><section id="disconnected"></section><footer><span>One core · Shared language servers · Optional Zed companion</span><code id="endpoint"></code></footer></main>
<script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let last='';let busy=false;
$('endpoint').textContent=location.origin+'/mcp';
async function refresh(){if(busy)return;try{const r=await fetch('/api/status');if(!r.ok)throw Error('Core unavailable');const data=await r.json();$('connection').textContent='Core connected';const key=JSON.stringify(data);if(key===last)return;last=key;
$('workspaces').innerHTML=data.workspaces.length?data.workspaces.map(w=>`<article><div class="row"><div><h2>${esc(w.workspace.split('/').pop())}</h2><div class="path">${esc(w.workspace)}</div></div><div class="row"><button data-operation="workspace_disconnect" data-workspace="${esc(w.workspace)}">Disconnect</button><span class="badge ${w.ready?'':'muted'}">${w.ready?'Analyzer ready':esc(w.status)}</span></div></div><div class="stats"><div><div class="label">Editor connection</div><div class="value">${w.companion?'Zed · Connected':'Standalone · Disk files'}</div></div><div><div class="label">Saved-file check</div><div class="value">${w.check.running?'Checking…':w.checkFresh?(w.check.success?'Passed':'Errors found'):'Not checked for current changes'}</div></div><div><div class="label">Analyzer process</div><div class="value">${(w.analyzers||[{language:"rust",pid:w.analyzerPid}]).map(a=>`${esc(a.language)} · PID ${esc(a.pid??"—")}`).join("<br>")}</div></div></div>${w.check.error?`<p class="error">${esc(w.check.error)}</p>`:''}${w.watcherError?`<p class="error">${esc(w.watcherError)}</p>`:''}<details><summary>Document state · ${w.documents.length} files</summary><table><thead><tr><th>File</th><th>Source</th><th>Version</th></tr></thead><tbody>${w.documents.map(d=>`<tr><td>${esc(decodeURI(d.uri).replace('file://'+w.workspace+'/',''))}</td><td>${esc(d.source)}</td><td>${d.version}</td></tr>`).join('')}</tbody></table></details><details><summary>Compiler diagnostics · ${w.check.diagnostics.length}</summary><p>Saved files only. Request a check through the diagnostics agent tool.</p><pre>${esc(w.check.diagnostics.map(d=>d.rendered||d.message).join('\n')||'No compiler diagnostics cached. Check status above before interpreting this as clean.')}</pre></details><details><summary>Workspace configuration</summary><pre>${esc(JSON.stringify(w.config,null,2))}</pre></details></article>`).join(''):`<div class="empty"><div class="eyebrow">Ready when you are</div><h2>Connect your first workspace</h2><p>Choose a directory containing Cargo.toml, tsconfig.json or package.json.<br>Agents and the Zed companion can also connect workspaces automatically.</p></div>`;$('disconnected').innerHTML=(data.disconnectedWorkspaces||[]).length?'<h2>Disconnected workspaces</h2><p>Analyzers are stopped. Reconnect explicitly to resume.</p>'+data.disconnectedWorkspaces.map(path=>`<article><div class="row"><div class="path">${esc(path)}</div><button data-operation="workspace_connect" data-workspace="${esc(path)}">Reconnect</button></div></article>`).join(''):'';}catch(e){$('connection').textContent='Core disconnected';}}
$('attach').onsubmit=async e=>{e.preventDefault();$('add').disabled=true;$('error').textContent='';try{const r=await fetch('/api/workspaces',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({workspace:$('workspace').value})});const v=await r.json();if(!r.ok)throw Error(v.error);$('workspace').value='';await refresh();}catch(e){$('error').textContent=e.message;}finally{$('add').disabled=false;}};
document.querySelector('main').addEventListener('click',async e=>{const button=e.target.closest('button[data-operation]');if(!button||busy)return;busy=true;button.disabled=true;$('error').textContent='';try{const r=await fetch('/api/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({operation:button.dataset.operation,arguments:{workspace:button.dataset.workspace}})});const v=await r.json();if(!r.ok)throw Error(v.error?.message||'Workspace operation failed');last='';}catch(e){$('error').textContent=e.message;}finally{busy=false;button.disabled=false;await refresh();}});
refresh();setInterval(refresh,2000);
</script></body></html>
